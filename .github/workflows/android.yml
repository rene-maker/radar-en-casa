name: App Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk radar-en-casa.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app radar-en-casa.apk \
            --title "Radar en Casa para Android" \
            --notes "Versión ${{ github.run_number }}. Descarga radar-en-casa.apk en el móvil e instálalo."
      - name: Copiar el APK a la web (descarga directa desde GitHub Pages)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          cp radar-en-casa.apk ./radar-en-casa.apk.tmp && mv radar-en-casa.apk.tmp radar-en-casa.apk
          git add -f radar-en-casa.apk
          git commit -m "APK versión ${{ github.run_number }}" || exit 0
          git push origin HEAD:main
